[project]
name = "wildecho"
version = "0.7.0"
description = "Fast local analysis of AudioMoth recordings with BirdNET, speech detection, and speaker diarization."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "heiplanet" }]

dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "soxr>=0.5",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "silero-vad>=5.1",
    "onnxruntime>=1.16",
    "torch>=2.2",
    "torchaudio>=2.2",
    "diarize>=0.1.1",
    "birdnetlib>=0.16",
    "ai-edge-litert>=2.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
wildecho = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocessing", "src/models", "src/pipeline", "src/cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
